name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: gofmt -w cmd examples internal playdate
      - name: Verify formatting
        run: git diff --exit-code
      - name: Test, including external consumer acceptance
        run: go test -count=1 -shuffle=on ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/gopdsdk
      - name: Diagnose environment without an installed SDK
        run: go run ./cmd/gopdsdk doctor
      - name: Verify Simulator plan through CLI
        run: go run ./cmd/gopdsdk build --dry-run --sdk "${{ runner.temp }}/Playdate SDK" ./examples/hello
      - name: Verify device plan through CLI
        run: go run ./cmd/gopdsdk build device --dry-run --sdk "${{ runner.temp }}/Playdate SDK" ./examples/hello

  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
